agents:
  queue: hosted-linux

cache: ".buildkite/cache-volume"

env:
  MISE_GITHUB_ATTESTATIONS: "false"
  MISE_RUBY_GITHUB_ATTESTATIONS: "false"

common_mise_plugin: &mise_plugin
  version: 2026.6.6

steps:
  - label: ":semver: Verify tag matches version.rb"
    key: verify-tag
    if: build.tag != null
    command: mise run release:verify-tag
    plugins:
      - mise#v1.1.4: *mise_plugin

  - group: ":package: Native gems"
    key: native-gems
    steps:
      - label: ":package: {{matrix}} gem"
        command: |
          mise run release:build-gem
          buildkite-agent artifact upload "pkg/*-{{matrix}}.gem"
        env:
          RELEASE_PLATFORM: "{{matrix}}"
        matrix:
          - x86_64-linux
          - aarch64-linux
          - x86_64-linux-musl
          - aarch64-linux-musl
          - arm64-darwin
          - x86_64-darwin
        plugins:
          - mise#v1.1.4: *mise_plugin

  # RubyGems gem-level "latest" follows the ruby-platform version. Native-only
  # releases leave the previous ruby gem as latest (as happened with 0.4.2).
  # The task wipes pkg/ and asserts the built gem is ruby-platform, so a bare
  # glob is unambiguous here and avoids Buildkite interpolating shell variables.
  - label: ":package: ruby gem"
    key: ruby-gem
    command: |
      mise run release:build-ruby-gem
      buildkite-agent artifact upload "pkg/*.gem"
    plugins:
      - mise#v1.1.4: *mise_plugin

  - label: ":mac: Smoke install arm64-darwin gem"
    key: macos-smoke
    depends_on: native-gems
    agents:
      queue: hosted-macos
    command: |
      buildkite-agent artifact download "pkg/*-arm64-darwin.gem" .
      mise run release:smoke-install-gem
    plugins:
      - mise#v1.1.4: *mise_plugin

  # Publish only runs on a real version tag AND when not a dry run.
  # Trigger a manual build (no tag) or set DRY_RUN=true to exercise the
  # cross-compile + smoke steps without publishing to rubygems.org.
  # Explicit depends_on ensures the ruby-platform gem is present before push.
  - label: ":rubygems: Publish"
    key: publish
    depends_on:
      - native-gems
      - ruby-gem
      - macos-smoke
    if: build.tag != null && build.env("DRY_RUN") != "true"
    command: |
      buildkite-agent artifact download "pkg/*.gem" .
      ls -lh pkg/*.gem
      mise run release:publish-gems
    plugins:
      - mise#v1.1.4: *mise_plugin
      - rubygems-oidc#v0.2.0:
          role: rg_oidc_akr_rs1t9xbwpcnjzgothwtv
