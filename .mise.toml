[settings]
github_attestations = false

[settings.ruby]
compile = false
github_attestations = false

[tools]
ruby = "4.0"
rust = "1.96.0"

[env]
BUNDLE_JOBS = "4"
BUNDLE_RETRY = "3"
CARGO_TERM_COLOR = "always"

[tasks.deps]
description = "Install Ruby gem dependencies"
run = "bundle check || bundle install"

[tasks.compile]
description = "Compile the native extension"
run = "bundle exec rake compile"
depends = ["deps"]

[tasks.test]
description = "Compile the extension and run the RSpec suite"
run = "bundle exec rake"
depends = ["deps"]

[tasks.rubocop]
description = "Run RuboCop"
run = "bundle exec rubocop"
depends = ["deps"]

[tasks.clippy]
description = "Run cargo clippy"
run = "cargo clippy --all-targets --all-features"

[tasks.lint]
description = "Run all lint checks"
run = """
mise run clippy
mise run rubocop
"""

[tasks."release:verify-tag"]
description = "Fail unless the git tag (BUILDKITE_TAG) matches SlateDb::VERSION"
run = """
tag="${BUILDKITE_TAG:-}"
test -n "$tag" || { echo "No BUILDKITE_TAG set; skipping tag/version check" >&2; exit 0; }
version="$(ruby -r ./lib/slatedb/version -e 'print SlateDb::VERSION')"
expected="v${version}"
if [ "$tag" != "$expected" ]; then
  echo "Tag/version mismatch: tag '$tag' but version.rb is '$version' (expected tag '$expected')" >&2
  exit 1
fi
echo "OK: tag '$tag' matches version.rb ('$version')"
"""

[tasks."release:build-gem"]
description = "Cross-compile a native gem for RELEASE_PLATFORM"
run = """
test -n "${RELEASE_PLATFORM:-}" || { echo "RELEASE_PLATFORM is required" >&2; exit 1; }
bundle exec rb-sys-dock --platform "$RELEASE_PLATFORM" --ruby-versions "3.3,3.4,4.0" --build
"""
depends = ["deps"]

[tasks."release:build-ruby-gem"]
description = "Build the generic ruby-platform gem"
shell = "bash -c"
run = """
set -euo pipefail
rm -rf pkg
mkdir -p pkg

# Prefer gem build over rake build so we always get the pure ruby-platform
# source gem (required for RubyGems gem-level latest metadata).
gem build slatedb.gemspec --output "pkg/slatedb-build.gem"

version="$(ruby -r ./lib/slatedb/version -e 'print SlateDb::VERSION')"
gem_file="pkg/slatedb-${version}.gem"
mv -f pkg/slatedb-build.gem "$gem_file"

ruby -e '
require "rubygems/package"
path = ARGV.fetch(0)
spec = Gem::Package.new(path).spec
unless spec.platform == Gem::Platform::RUBY
  warn "Expected ruby platform gem, got #{spec.platform.inspect} in #{path}"
  exit 1
end
puts "OK: #{path} platform=#{spec.platform} version=#{spec.version}"
' "$gem_file"
"""
depends = ["deps"]

[tasks."release:smoke-install-gem"]
description = "Install a built gem and verify it loads"
run = """
gem_file="${RELEASE_GEM_FILE:-}"
if [ -z "$gem_file" ]; then gem_file="$(find pkg -name '*.gem' | head -n 1)"; fi
if [ -z "$gem_file" ] || [ ! -f "$gem_file" ]; then echo "No gem found to smoke install" >&2; exit 1; fi
# Allow RubyGems to resolve runtime deps (e.g. rb_sys) on a clean agent.
gem install "$gem_file" --no-document
smoke_dir="$(mktemp -d)"; cd "$smoke_dir"
ruby -rslatedb -e 'puts SlateDb::VERSION'
"""

[tasks."release:publish-gems"]
description = "Publish pre-built gems from pkg/ to RubyGems"
shell = "bash -c"
run = """
set -euo pipefail
test -n "${GEM_HOST_API_KEY:-}" || { echo "GEM_HOST_API_KEY is required" >&2; exit 1; }

version="$(ruby -r ./lib/slatedb/version -e 'print SlateDb::VERSION')"
required=(
  "pkg/slatedb-${version}.gem"
  "pkg/slatedb-${version}-x86_64-linux.gem"
  "pkg/slatedb-${version}-aarch64-linux.gem"
  "pkg/slatedb-${version}-x86_64-linux-musl.gem"
  "pkg/slatedb-${version}-aarch64-linux-musl.gem"
  "pkg/slatedb-${version}-arm64-darwin.gem"
  "pkg/slatedb-${version}-x86_64-darwin.gem"
)

missing=0
for gem_file in "${required[@]}"; do
  if [ ! -f "$gem_file" ]; then
    echo "Missing required gem before publish: $gem_file" >&2
    missing=1
  fi
done
if [ "$missing" -ne 0 ]; then
  echo "Present gems:" >&2
  ls -lh pkg/*.gem >&2 || true
  exit 1
fi

ruby -e '
require "rubygems/package"
path = ARGV.fetch(0)
spec = Gem::Package.new(path).spec
unless spec.platform == Gem::Platform::RUBY
  warn "RubyGems latest metadata requires a ruby-platform gem; got #{spec.platform.inspect} in #{path}"
  exit 1
end
puts "OK: ruby-platform gem present (#{path})"
' "pkg/slatedb-${version}.gem"

for gem_file in "${required[@]}"; do
  echo "Pushing ${gem_file}"
  gem push "$gem_file"
done
"""
depends = ["deps"]

[tasks."ci:install-system-deps"]
description = "Install CI system packages required to build the native extension"
run = """
if command -v apt-get >/dev/null 2>&1; then
  if [ "$(id -u)" -eq 0 ]; then
    apt-get update
    apt-get install -y --no-install-recommends libclang-dev
  else
    sudo apt-get update
    sudo apt-get install -y --no-install-recommends libclang-dev
  fi
fi
"""

[tasks."ci:test"]
description = "Install CI dependencies and run the test suite"
run = """
mise run ci:install-system-deps
mise run test
"""

[tasks."ci:clippy"]
description = "Install CI dependencies and run cargo clippy"
run = """
mise run ci:install-system-deps
mise run clippy
"""

[tasks."ci:rubocop"]
description = "Run RuboCop in CI"
run = "mise run rubocop"
