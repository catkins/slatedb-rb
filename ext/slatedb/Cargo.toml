[package]
name = "slatedb"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Ruby bindings for SlateDB"

[lib]
name = "slatedb"
crate-type = ["cdylib"]

[dependencies]
slatedb = "0.17.0"
magnus = { version = "0.9.3", features = ["rb-sys"] }
rb-sys = { version = "0.9.130", features = ["stable-api-compiled-fallback"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
bytes = "1.12.1"
serde_json = "1.0.154"
url = "2.5.8"
once_cell = "1.21.4"
log = "0.4.34"
uuid = "1.29.0"
